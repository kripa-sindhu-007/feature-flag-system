services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: featureflags
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Migrations are applied by the backend's own ordered runner (internal/migrate),
      # not the initdb hook — a single, tracked source of truth for schema changes.
      # The runner is advisory-locked, so the 3 replicas migrate safely on boot.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 3 backend replicas (D1): real cross-instance topology. Each has its own
  # NODE_ID and directly-published port so the cluster panel can poll each node's
  # config_version; production traffic goes through the nginx LB on :8080. ---
  backend1: &backend
    build: ./backend
    environment: &backend-env
      PORT: "8080"
      NODE_ID: "backend1"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      ADMIN_API_KEY: "admin-secret-key"
      SDK_API_KEY: "sdk-secret-key"
      # Local dev: allow localhost, loopback, and the private LAN range on any
      # port (go-chi/cors wildcard). Auth is header-based (X-*-API-Key), not
      # cookies, so reflecting these local origins is safe here.
      ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*,http://192.168.*"
      # Exemplar tracing (best-effort): exports the flag.propagate span to the
      # OTLP/HTTP collector. If the collector is down the batch exporter just
      # drops spans — it never blocks or fails a flag write, so no depends_on.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend2:
    <<: *backend
    environment:
      <<: *backend-env
      NODE_ID: "backend2"
    ports:
      - "8082:8080"

  backend3:
    <<: *backend
    environment:
      <<: *backend-env
      NODE_ID: "backend3"
    ports:
      - "8083:8080"

  # Load balancer: round-robins /flags & writes; SSE streams stick to one node
  # for the connection's lifetime (proxy_buffering off keeps frames flowing).
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    # Match nginx worker_rlimit_nofile so it can actually open the raised
    # worker_connections' worth of fds (each SSE stream = client + upstream fd).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - backend1
      - backend2
      - backend3

  # --- Week 3 observability infra ---

  # OTLP/HTTP + gRPC receiver -> debug exporter, so the exemplar
  # flag.propagate -> redis.publish -> sse.broadcast span is visible in
  # `docker compose logs otel-collector`. Best-effort target for the backends;
  # nothing depends on it, and its being down never breaks a flag write.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend1
      - backend2
      - backend3

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      # Local demo only: default admin/admin, plus anonymous viewer so the
      # dashboard opens with zero friction. Do NOT reuse these in production.
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* must be baked at build time (Next inlines them into the
      # client bundle) — the cluster panel needs NODE_URLS to reach each node.
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
        NEXT_PUBLIC_SDK_KEY: "sdk-secret-key"
        NEXT_PUBLIC_NODE_URLS: "http://localhost:8081,http://localhost:8082,http://localhost:8083"
        # W3 health page: Prometheus query API for fleet metrics + Grafana link-out.
        NEXT_PUBLIC_PROMETHEUS_URL: "http://localhost:9090"
        NEXT_PUBLIC_GRAFANA_URL: "http://localhost:3001"
    # W4 D3 security fix: the admin key is a RUNTIME server env (never a build
    # arg, never NEXT_PUBLIC_*), consumed only by the server-side BFF proxy in
    # app/api/admin/**. API_INTERNAL_URL is the Next server's path to the backend
    # over the docker network (the browser only ever calls same-origin /api/admin).
    environment:
      ADMIN_API_KEY: "admin-secret-key"
      API_INTERNAL_URL: "http://lb:8080"
    ports:
      - "3000:3000"
    depends_on:
      - lb

volumes:
  pgdata:
  grafana-data:
