name: 💡 Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search
        [existing issues](https://github.com/kripa-sindhu-007/feature-flag-system/issues?q=is%3Aissue)
        first — someone may have proposed it already.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the motivation. What are you trying to do that's hard or impossible today?
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Describe the behavior or UI you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why the proposal is better.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API (Go)
        - Frontend / Dashboard (Next.js)
        - SDK (TypeScript or Go)
        - Observability
        - Infrastructure / Ops
        - Docs / Learning experience
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
