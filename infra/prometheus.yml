global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # All three backend replicas expose /metrics on their in-network container
  # port 8080 (the host-mapped 8081-8083 are irrelevant inside the compose net).
  - job_name: feature-flag-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend1:8080
          - backend2:8080
          - backend3:8080
