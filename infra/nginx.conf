# Each proxied SSE stream holds a client conn + an upstream conn, so a low
# worker_connections caps concurrent streams at ~half its value. The default
# 512 topped the fleet out at ~250 streams; raise it for an SSE gateway.
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    upstream backends {
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";

            # SSE: never buffer, keep long-lived streams open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
