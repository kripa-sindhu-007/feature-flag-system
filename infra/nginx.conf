# Each proxied SSE stream holds a client conn + an upstream conn, so a low
# worker_connections caps concurrent streams at ~half its value. The default
# 512 topped the fleet out at ~250 streams; raise it for an SSE gateway.
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    upstream backends {
        # max_fails/fail_timeout: after 2 failed attempts a dead node is taken
        # out of rotation for 5s, so it isn't retried on every single request
        # while it is down.
        server backend1:8080 max_fails=2 fail_timeout=5s;
        server backend2:8080 max_fails=2 fail_timeout=5s;
        server backend3:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";

            # Fast failover on node death (W4 hardening). A killed backend's IP
            # goes unrouteable, so a connect to it would otherwise hang for the
            # 60s default before nginx tries a survivor. Bound the connect probe
            # to 2s and retry the other upstreams, so a single dead node adds at
            # most ~2s to a request instead of stalling it. proxy_read_timeout
            # stays long — that governs the live SSE stream, not failover.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # SSE: never buffer, keep long-lived streams open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
